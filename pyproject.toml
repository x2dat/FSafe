[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsafe"
version = "1.3.0"
description = "Web application vulnerability scanner — authorized testing only"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "FSafe contributors" }]
keywords = ["security", "scanner", "vulnerability", "pentest", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/x2dat/fsafe"
Issues = "https://github.com/x2dat/fsafe/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "build>=1.0"]

[project.scripts]
fsafe = "fsafe.cli:main"
fsafe-dashboard = "fsafe.main:run"
fsafe-demo = "fsafe.demo_target:main"

[tool.setuptools]
packages = ["fsafe"]

[tool.setuptools.package-data]
fsafe = ["frontend/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
